<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#D80019">
<meta name="description" content="Foodies — Love Food. Love Life. Meet people who share your taste.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Foodies — Love Food. Love Life</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D80019;
  --red-deep:#A80014;
  --red-dark:#7C0010;
  --coral:#F26D6D;
  --coral-soft:#F79A9A;
  --teal:#12B5A5;
  --ink:#1C2430;
  --slate:#5A6472;
  --mist:#EEF1F4;
  --line:#E4E8ED;
  --white:#ffffff;
  --gold:#D9A441;
  --shadow:0 10px 30px rgba(20,20,30,.14);
  --shadow-lg:0 24px 60px rgba(20,20,30,.28);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#2a2d33;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.script{font-family:'Pacifico',cursive;font-weight:400}

/* ---------- Phone frame ---------- */
#device{
  position:relative;
  width:min(430px,100vw);
  height:min(932px,100vh);
  background:var(--white);
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}
@media(min-width:460px) and (min-height:960px){
  #device{border-radius:44px;border:12px solid #0d0d10;height:900px}
}
#screens{position:absolute;inset:0}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateX(24px);
  transition:opacity .32s ease,transform .32s ease,visibility .32s;
  background:var(--white);
}
.screen.active{opacity:1;visibility:visible;transform:none;z-index:2}
.screen.red-bg{background:var(--red)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

/* ---------- Shared UI ---------- */
.pad{padding:22px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.brandmark{font-family:'Pacifico',cursive;color:#fff;line-height:1}
.tag{letter-spacing:3px;font-size:11px;font-weight:700;color:rgba(255,255,255,.92)}
.tag b{color:#fff}
.btn{
  border:0;border-radius:16px;font-family:inherit;font-weight:700;font-size:16px;
  padding:16px 20px;cursor:pointer;width:100%;transition:transform .12s ease,filter .2s ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(216,0,25,.32)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(242,109,109,.36)}
.btn-white{background:#fff;color:var(--red)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.btn-dark{background:var(--ink);color:#fff}
.btn-sm{padding:11px 16px;font-size:14px;border-radius:12px;width:auto}
.link{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;opacity:.9}

/* Header bar (in-app) */
.appbar{
  background:var(--red);color:#fff;padding:16px 18px 14px;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
}
.appbar .script{font-size:26px}
.appbar h2{font-size:19px;font-weight:800;letter-spacing:.3px}
.appbar .back{background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;border-radius:11px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.appbar .spacer{flex:1}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1.5px solid var(--line);background:#fff;color:var(--slate);
  border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:all .15s ease;user-select:none;
}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.diet.on{background:var(--teal);border-color:var(--teal)}
.chip-static{background:var(--mist);border:0;color:var(--slate);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700}
.chip-static.hot{background:#FFE9E9;color:var(--red)}
.chip-static.teal{background:#DFF6F3;color:#0C8073}

/* Field */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:7px;letter-spacing:.2px}
.field input,.field select{
  width:100%;border:1.5px solid var(--line);border-radius:13px;padding:14px;font:inherit;font-size:15px;color:var(--ink);background:#fff;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--coral)}

/* progress */
.prog{height:5px;background:rgba(255,255,255,.28);border-radius:3px;overflow:hidden;margin:2px 0 0}
.prog.dark{background:var(--mist)}
.prog i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .4s ease}
.prog.dark i{background:var(--coral)}

/* ---------- Onboarding slides ---------- */
.ob{position:absolute;inset:0;display:none;flex-direction:column;justify-content:space-between;padding:0;background:var(--red)}
.ob.active{display:flex;animation:fade .4s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Swipe deck ---------- */
#deck{flex:1;position:relative;padding:14px 14px 0}
.card{
  position:absolute;inset:14px 14px 0;border-radius:24px;overflow:hidden;
  background:#333;box-shadow:var(--shadow-lg);will-change:transform;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.35) 42%,rgba(0,0,0,0) 68%)}
.card .body{position:relative;padding:18px 20px 20px;color:#fff}
.card .name{font-size:25px;font-weight:800;display:flex;align-items:center;gap:8px}
.card .name .vf{font-size:15px;color:#4FC3F7}
.card .meta{font-size:13.5px;opacity:.92;margin:4px 0 10px;display:flex;gap:12px;flex-wrap:wrap}
.card .prompt{background:rgba(255,255,255,.14);backdrop-filter:blur(4px);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:11px;border:1px solid rgba(255,255,255,.15)}
.card .prompt b{display:block;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.card .cui{display:flex;flex-wrap:wrap;gap:6px}
.card .cui span{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.card .cui span.shared{background:var(--teal);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.stamp{position:absolute;top:26px;font-size:30px;font-weight:800;letter-spacing:2px;padding:6px 16px;border-radius:12px;border:4px solid;opacity:0;transform:rotate(-14deg);z-index:5}
.stamp.like{left:20px;color:var(--teal);border-color:var(--teal)}
.stamp.nope{right:20px;color:var(--coral);border-color:var(--coral)}
.match-badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;background:var(--teal);color:#fff;font-size:11px;font-weight:800;letter-spacing:.5px;padding:6px 13px;border-radius:999px;box-shadow:0 6px 14px rgba(18,181,165,.4)}
#deckEmpty{position:absolute;inset:14px 14px 0;border-radius:24px;background:var(--mist);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--slate)}

/* deck action bar */
.actions{display:flex;gap:14px;align-items:center;justify-content:center;padding:16px 0 8px}
.act{border:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:var(--shadow);transition:transform .12s}
.act:active{transform:scale(.9)}
.act.sm{width:50px;height:50px;font-size:20px}
.act.lg{width:64px;height:64px;font-size:26px}
.act.nope{color:var(--coral)} .act.like{color:var(--teal)} .act.star{color:var(--gold)} .act.rewind{color:#7C8698}

/* bottom nav */
.tabbar{
  display:flex;background:#fff;border-top:1px solid var(--line);flex-shrink:0;
  padding-bottom:var(--safe-b);
}
.tabbar button{flex:1;background:none;border:0;padding:11px 0 10px;cursor:pointer;color:#9AA3B0;font-size:22px;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:10px;font-weight:700}
.tabbar button.on{color:var(--red)}
.tabbar button .dot{position:absolute;top:6px;right:calc(50% - 18px);background:var(--coral);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* Match overlay */
#matchOverlay{position:absolute;inset:0;z-index:60;background:linear-gradient(160deg,var(--red),var(--red-dark));display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff}
#matchOverlay.show{display:flex;animation:fade .35s}
.match-photos{display:flex;justify-content:center;margin:8px 0 20px}
.match-photos .mp{width:118px;height:118px;border-radius:50%;border:4px solid #fff;object-fit:cover;box-shadow:var(--shadow-lg)}
.match-photos .mp:last-child{margin-left:-26px}
.confetti{position:absolute;width:9px;height:14px;border-radius:2px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg);opacity:.2}}

/* explore cards */
.vcard{display:flex;gap:12px;border:1px solid var(--line);border-radius:18px;padding:11px;margin-bottom:13px;cursor:pointer;background:#fff;transition:transform .12s,box-shadow .2s}
.vcard:active{transform:scale(.99)}
.vcard img{width:92px;height:92px;border-radius:13px;object-fit:cover;flex-shrink:0}
.vcard .vc{flex:1;min-width:0}
.vcard .vn{font-weight:800;font-size:15.5px}
.vcard .vsub{font-size:12.5px;color:var(--slate);margin:2px 0 7px;display:flex;gap:9px;flex-wrap:wrap}
.rowb{display:flex;gap:6px;flex-wrap:wrap}
.offer{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.2px}

/* section head */
.shead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
.shead h3{font-size:17px;font-weight:800}
.shead .more{color:var(--coral);font-size:13px;font-weight:700;cursor:pointer;background:none;border:0}

/* chat list */
.crow{display:flex;gap:13px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--mist);cursor:pointer}
.crow img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.crow .ci{flex:1;min-width:0}
.crow .cn{font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.crow .cn small{font-weight:500;color:#9AA3B0;font-size:11px}
.crow .cm{font-size:13px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.crow .badge{background:var(--coral);color:#fff;font-size:10px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* chat thread */
#thread{flex:1;overflow-y:auto;padding:16px;background:#FAFBFC;display:flex;flex-direction:column;gap:9px}
.bub{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.4}
.bub.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.bub.me{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bub.venue{align-self:flex-start;padding:0;overflow:hidden;background:#fff;border:1px solid var(--line);width:80%;border-radius:16px}
.bub.venue img{width:100%;height:96px;object-fit:cover;display:block}
.bub.venue .vb{padding:10px 12px}
.bub.venue .vb b{font-size:14px}
.bub.venue .vb p{font-size:11.5px;color:var(--slate);margin:2px 0 8px}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;padding:13px 16px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#B7BFC9;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.ice{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff;border-top:1px solid var(--mist)}
.ice::-webkit-scrollbar{height:0}
.ice button{white-space:nowrap;background:#FFE9E9;color:var(--red);border:0;border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0}
.composer{display:flex;gap:9px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);background:#fff;padding-bottom:calc(11px + var(--safe-b))}
.composer input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;font:inherit;font-size:14px}
.composer input:focus{outline:none;border-color:var(--coral)}
.composer .send{background:var(--red);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.composer .share{background:#fff;color:var(--red);border:1.5px solid var(--red);width:44px;height:44px;border-radius:50%;font-size:19px;cursor:pointer;flex-shrink:0}

/* venue detail */
#vdImg{width:100%;height:230px;object-fit:cover}
.vdhead{padding:18px 20px 0}
.vdhead h2{font-size:23px;font-weight:800}
.vdrow{display:flex;align-items:center;gap:7px;color:var(--slate);font-size:13.5px;margin-top:6px}
.info-line{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--mist);font-size:14px}
.info-line .ic{font-size:18px;width:24px;text-align:center}
.info-line b{display:block;font-size:12px;color:var(--slate);font-weight:700;margin-bottom:2px}

/* booking */
.seg{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}
.seg::-webkit-scrollbar{height:0}
.datep{flex-shrink:0;border:1.5px solid var(--line);border-radius:14px;padding:11px 15px;text-align:center;cursor:pointer;min-width:60px}
.datep.on{background:var(--teal);border-color:var(--teal);color:#fff}
.datep b{display:block;font-size:11px;opacity:.8}.datep span{font-size:19px;font-weight:800}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.slot{border:1.5px solid var(--line);border-radius:12px;padding:12px 0;text-align:center;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--slate)}
.slot.on{background:var(--red);border-color:var(--red);color:#fff}
.slot.off{opacity:.4;pointer-events:none}
.stepper{display:flex;align-items:center;gap:18px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--coral);background:#fff;color:var(--coral);font-size:20px;font-weight:700;cursor:pointer}
.stepper span{font-size:20px;font-weight:800;min-width:24px;text-align:center}

/* profile */
.pfhero{position:relative}
.pfhero img{width:100%;height:250px;object-fit:cover}
.pfhero .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 55%)}
.pfhero .nm{position:absolute;bottom:16px;left:20px;color:#fff}
.pfhero .nm h2{font-size:24px;font-weight:800}
.tier{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#F6D488,#D9A441);color:#5C4008;font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px;margin-top:6px}
.menu-row{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--mist);font-size:15px;font-weight:600;cursor:pointer}
.menu-row .ic{font-size:20px;width:26px;text-align:center}
.menu-row .ar{margin-left:auto;color:#C4CBD4}

/* plans */
.plan{border:2px solid var(--line);border-radius:20px;padding:20px;margin-bottom:15px;position:relative}
.plan.gold{border-color:var(--gold);background:linear-gradient(180deg,#FFFBF2,#fff)}
.plan .pt{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--slate)}
.plan.gold .pt{color:#B8860B}
.plan .pp{font-size:32px;font-weight:800;margin:6px 0 3px}
.plan .pp small{font-size:14px;font-weight:600;color:var(--slate)}
.plan ul{list-style:none;margin:14px 0 0}
.plan li{font-size:13.5px;padding:6px 0 6px 26px;position:relative;color:var(--ink)}
.plan li:before{content:"✓";position:absolute;left:0;color:var(--teal);font-weight:800}
.plan .rec{position:absolute;top:-11px;right:18px;background:var(--gold);color:#fff;font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:999px;letter-spacing:.5px}

.toast{position:absolute;bottom:calc(80px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;transition:all .3s;z-index:70;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.muted{color:var(--slate)}
.h-sub{font-size:13px;color:var(--slate);line-height:1.5}
h1.big{font-size:29px;font-weight:800;line-height:1.15}
.divide{height:1px;background:var(--mist);margin:16px 0}
.safety{background:#FFF6F6;border:1px solid #F8D7D7;border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--red-dark);line-height:1.55}
.pill-toggle{display:flex;background:var(--mist);border-radius:12px;padding:4px;margin-bottom:14px}
.pill-toggle button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:inherit;font-weight:700;font-size:13.5px;color:var(--slate);cursor:pointer}
.pill-toggle button.on{background:#fff;color:var(--red);box-shadow:0 2px 6px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div id="device">
  <div id="screens"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   FOODIES — clickable PWA demo (sample data, no backend)
   ============================================================ */

// ---- Sample data ---------------------------------------------------
const CUISINES = ["Italian","Indian","Japanese","Lebanese","Chinese","Thai","Mexican","French","Korean","Turkish","Greek","Spanish","Vietnamese","Ethiopian"];

const me = { name:"You", cuisines:["Italian","Japanese","Lebanese"], diets:["Halal"] };

const FOODIES = [
  {id:1,name:"Amara",age:27,dist:"1.2 mi",looking:"Relationship",verified:true,
   img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=800&q=80",

  {id:2,name:"Priya",age:29,dist:"0.8 mi",looking:"Something casual",verified:true,
   img:"https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=800&q=80",
   cuisines:["Indian","Japanese","Korean"],
   prompt:{q:"Order for the table or your own?",a:"Order for the table — always. Sharing is the whole point."}},
  {id:3,name:"Sofia",age:25,dist:"2.4 mi",looking:"Relationship",verified:false,
   img:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&q=80",
   cuisines:["Japanese","Italian","French"],
   prompt:{q:"Best meal you've had this year",a:"Omakase in Soho. I still think about the uni."}},
  {id:4,name:"Leila",age:31,dist:"3.1 mi",looking:"New friends",verified:true,
   img:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=800&q=80",
   cuisines:["Lebanese","Turkish","Greek"],
   prompt:{q:"Sweet or savoury?",a:"Both, at once, no notes. Baklava counts as breakfast."}},
  {id:5,name:"Chloé",age:26,dist:"1.9 mi",looking:"Relationship",verified:true,
   img:"https://images.unsplash.com/photo-1502823403499-6ccfcf4fb453?w=800&q=80",
   cuisines:["French","Italian","Spanish"],
   prompt:{q:"Dream dinner guest",a:"Someone who'll split a bottle and stay for dessert."}}
];

const VENUES = [
  {id:1,name:"Hotel Casablanca",area:"Mayfair, London",rating:4.5,dist:"0.9 mi",price:"£££",
   cuisines:["Italian","Lebanese","Mediterranean"],diets:["Halal","Vegetarian"],

}
function topCard(){const deck=$("#deck");return deck?deck.lastElementChild:null;}
function attachDrag(card){
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const like=card.querySelector(".stamp.like"),nope=card.querySelector(".stamp.nope");
  const down=e=>{drag=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;card.style.transition="none";};
  const move=e=>{if(!drag)return;const p=e.touches?e.touches[0]:e;dx=p.clientX-sx;dy=p.clientY-sy;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    like.style.opacity=Math.max(0,dx/90);nope.style.opacity=Math.max(0,-dx/90);};
  const up=()=>{if(!drag)return;drag=false;card.style.transition="transform .3s ease";
    if(dx>95){finishSwipe(card,"right");}
    else if(dx<-95){finishSwipe(card,"left");}
    else{card.style.transform="";like.style.opacity=0;nope.style.opacity=0;}dx=0;dy=0;};
  card.addEventListener("touchstart",down,{passive:true});card.addEventListener("touchmove",move,{passive:true});card.addEventListener("touchend",up);
  card.addEventListener("mousedown",down);window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
}
function swipe(dir){const card=topCard();if(!card)return;finishSwipe(card,dir);}
function finishSwipe(card,dir){
  const id=+card.dataset.id;const f=FOODIES.find(x=>x.id===id);
  state.lastSwiped=state.deckIdx;
  const off=dir==="left"?-600:600;
  card.style.transition="transform .35s ease";
  card.style.transform=`translate(${dir==="left"?-off:off}px,-40px) rotate(${dir==="left"?-24:24}deg)`;
  setTimeout(()=>{
    state.deckIdx++;
    if((dir==="right"||dir==="super")){
      const sh=shared(me.cuisines,f.cuisines);
      if(sh.length>=2){ // it's a match
        if(!state.matches.find(m=>m.id===f.id))state.matches.unshift(f);
        showMatch(f);
      }else toast(dir==="super"?"Super like sent ★":"Liked ♥");
    }
    initDeck();
  },320);
}
function rewind(){if(state.deckIdx>0){state.deckIdx--;initDeck();toast("Rewound ↩");}else toast("Nothing to undo");}
function resetDeck(){state.deckIdx=0;initDeck();}

/* ---------- venue matching logic (signature) ---------- */
function bestVenuesFor(f){
  const wantCui=[...new Set([...shared(me.cuisines,f.cuisines),...me.cuisines])];
  const wantDiet=me.diets;
  return [...VENUES].map(v=>{
    let score=0;
    v.cuisines.forEach(c=>{if(wantCui.includes(c))score+=wantCui.includes(c)&&shared(me.cuisines,f.cuisines).includes(c)?3:1;});
    if(wantDiet.every(d=>v.diets.includes(d)))score+=2;
    if(v.offer)score+=1;
    return {...v,score};
  }).sort((a,b)=>b.score-a.score);
}

      <div class="shead"><h3>Messages</h3></div>
      ${list.filter(m=>state.threads[m.id]).map(m=>{
        const t=state.threads[m.id];const last=t[t.length-1];
        return `<div class="crow" onclick="openChat(${m.id})">
          <img src="${m.img}">
          <div class="ci"><div class="cn">${m.name} <small>now</small></div>
          <div class="cm">${last.venue?"🍽️ Shared a venue":(last.who==='me'?'You: ':'')+last.text}</div></div>
        </div>`;
      }).join("")||'<p class="h-sub">Match with someone to start chatting.</p>'}
    </div>`;
}

/* ---------- CHAT THREAD ---------- */
function openChat(id){state.activeChat=id;go("chat",{id});}
route("chat",({id})=>{
  const f=FOODIES.find(x=>x.id===id)||state.matches.find(x=>x.id===id);
  const sh=shared(me.cuisines,f.cuisines);
  if(!state.threads[id])state.threads[id]=[];
  const ices=[
    `Omakase or ramen? 🍜`,`Best ${sh[0]||'dinner'} spot you know?`,`Free this Friday? 🍷`,`Sweet or savoury person?`
  ];
  return `
    <div class="appbar"><button class="back" onclick="enterApp()">‹</button>
      <img src="${f.img}" style="width:38px;height:38px;border-radius:50%;object-fit:cover">
      <div><div style="font-size:16px;font-weight:800;line-height:1.1">${f.name}</div><div style="font-size:11px;opacity:.85">● Online</div></div>
      <div class="spacer"></div><button class="back" onclick="toast('Block / report — demo')">⋯</button></div>
    <div style="background:#F0FBFA;border-bottom:1px solid #D8F0EC;padding:9px 16px;font-size:12px;color:#0C8073;display:flex;align-items:center;gap:8px">
      🍽️ You both love <b>${sh.join(" & ")||f.cuisines[0]}</b> · <button class="link" style="color:#0C8073;font-weight:700" onclick="openShare(${id})">suggest a venue</button></div>
    <div id="thread"></div>
    <div class="ice">${ices.map(i=>`<button onclick="quickSend(${id},'${i.replace(/'/g,"")}')">${i}</button>`).join("")}</div>
    <div class="composer">
      <button class="share" onclick="openShare(${id})">🍽️</button>
      <input id="msgInput" placeholder="Message ${f.name}…" onkeydown="if(event.key==='Enter')sendMsg(${id})">
      <button class="send" onclick="sendMsg(${id})">➤</button>
    </div>`;
});
routes.chat.after=(el,{id})=>{renderThread(id);};
function renderThread(id){
  const th=$("#thread");if(!th)return;
  th.innerHTML=state.threads[id].map(m=>{
    if(m.venue){const v=m.venue;return `<div class="bub venue"><img src="${v.img}"><div class="vb"><b>${v.name}</b><p>${v.cuisines.slice(0,2).join(", ")} · ${v.dist} · ${v.rating}⭐</p><button class="btn btn-coral btn-sm" style="width:100%" onclick="openVenue(${v.id})">Book a table</button></div></div>`;}
    return `<div class="bub ${m.who}">${m.text}</div>`;
  }).join("");
  th.scrollTop=th.scrollHeight;
}
function sendMsg(id){const inp=$("#msgInput");const v=inp.value.trim();if(!v)return;state.threads[id].push({who:"me",text:v});inp.value="";renderThread(id);replyLater(id);}
function quickSend(id,txt){state.threads[id].push({who:"me",text:txt});renderThread(id);replyLater(id);}
function replyLater(id){
  const th=$("#thread");const typ=document.createElement("div");typ.className="typing";typ.innerHTML="<i></i><i></i><i></i>";th.appendChild(typ);th.scrollTop=th.scrollHeight;
  const replies=["Ooh good question 😄","Yes! Let's do it.","I know the perfect place actually…","You had me at dessert."];
  setTimeout(()=>{typ.remove();state.threads[id].push({who:"them",text:replies[Math.floor(Math.random()*replies.length)]});renderThread(id);},1400);
}

/* ---------- SHARE VENUE in chat ---------- */
function openShare(id){go("share",{id});}
route("share",({id})=>{
  const f=FOODIES.find(x=>x.id===id)||state.matches.find(x=>x.id===id);
  const venues=bestVenuesFor(f);
  return `
    <div class="appbar"><button class="back" onclick="openChat(${id})">‹</button>
      <div class="script" style="font-size:20px">Suggest to ${f.name}</div></div>
    <div style="padding:12px 16px 0"><p class="h-sub">Best for you both — ranked by shared taste${me.diets.length?", "+me.diets[0].toLowerCase()+"-friendly":""} and live offers.</p></div>
    <div class="scroll pad" style="padding-top:12px">
      ${venues.map(v=>`<div class="vcard" style="align-items:center">
        <img src="${v.img}">
        <div class="vc"><div class="vn">${v.name}</div>
          <div class="vsub"><span>⭐ ${v.rating}</span><span>📍 ${v.dist}</span></div>
          <div class="rowb">${v.offer?`<span class="offer">🎁 offer</span>`:''}${shared(me.cuisines,f.cuisines).filter(c=>v.cuisines.includes(c)).map(c=>`<span class="chip-static teal">${c}</span>`).join("")}</div>
        </div>
        <button class="btn btn-coral btn-sm" style="align-self:center" onclick="shareVenue(${id},${v.id})">Send</button>
      </div>`).join("")}
    </div>`;
});
function shareVenue(chatId,venueId){const v=VENUES.find(x=>x.id===venueId);state.threads[chatId].push({who:"me",text:"How about here? 🍽️",});state.threads[chatId].push({who:"me",venue:v});openChat(chatId);toast("Venue shared");setTimeout(()=>replyLater(chatId),400);}

/* ---------- VENUE DETAIL ---------- */
function openVenue(id){state.bookingVenue=VENUES.find(v=>v.id===id);go("venue",{id});}
route("venue",({id})=>{
  const v=VENUES.find(x=>x.id===id);
  return `
    <div class="scroll">
      <div style="position:relative">
        <img id="vdImg" src="${v.img}">
        <button class="back" style="position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;background:rgba(0,0,0,.4)" onclick="enterApp()">‹</button>
        <button class="back" style="position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:rgba(0,0,0,.4)" onclick="toast('Saved to favourites ♥')">♡</button>
        ${v.offer?`<div style="position:absolute;bottom:14px;left:16px" class="offer">🎁 ${v.offer}</div>`:""}
      </div>
      <div class="vdhead">
        <h2>${v.name}</h2>
        <div class="vdrow"><span>⭐ ${v.rating}</span><span>·</span><span>📍 ${v.dist}</span><span>·</span><span>${v.price}</span><span>·</span><span>${v.area}</span></div>
        <div class="chips" style="margin-top:12px">${v.cuisines.map(c=>`<span class="chip-static ${me.cuisines.includes(c)?'teal':''}">${c}</span>`).join("")}${v.diets.map(d=>`<span class="chip-static hot">${d}</span>`).join("")}</div>
      </div>
      <div class="pad" style="padding-top:14px">
        <div class="info-line"><span class="ic">🕐</span><div><b>Open all week</b>${v.hours}</div></div>
        <div class="info-line"><span class="ic">📍</span><div><b>Address</b>${v.addr}</div></div>
        <div class="info-line"><span class="ic">🎉</span><div><b>Atmosphere</b>${v.tags.join(" · ")}</div></div>
        <div style="margin-top:10px"><button class="btn btn-coral" onclick="go('book',{id:${v.id}})">Book a table</button></div>
      </div>
    </div>`;
});

/* ---------- BOOKING ---------- */
route("book",({id})=>{
  const v=VENUES.find(x=>x.id===id);
  const days=["FRI","SAT","SUN","MON","TUE"];const nums=[8,9,10,11,12];
  const slots=["6:00","6:30","7:00","7:30","8:00","8:30","9:00","9:30","10:00"];
  const off=[0,8];
  return `
    <div class="appbar"><button class="back" onclick="openVenue(${id})">‹</button><div class="script" style="font-size:22px">Book a table</div></div>
    <div class="scroll pad">
      <div class="vcard" style="cursor:default"><img src="${v.img}"><div class="vc"><div class="vn">${v.name}</div><div class="vsub"><span>⭐ ${v.rating}</span><span>📍 ${v.dist}</span></div>${v.offer?`<span class="offer">🎁 ${v.offer}</span>`:''}</div></div>
      <div class="divide"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <b style="font-size:15px">Guests</b>
        <div class="stepper"><button onclick="stepGuests(-1)">−</button><span id="gv">${state.bookGuests}</span><button onclick="stepGuests(1)">+</button></div>
      </div>
      <b style="font-size:15px;display:block;margin-bottom:11px">Select date</b>
      <div class="seg" id="dateSeg">${days.map((d,i)=>`<div class="datep ${i===state.bookDate?'on':''}" onclick="pickDate(${i})"><b>${d}</b><span>${nums[i]}</span></div>`).join("")}</div>
      <b style="font-size:15px;display:block;margin:20px 0 11px">Select time</b>
      <div class="slots" id="slotGrid">${slots.map((s,i)=>`<div class="slot ${off.includes(i)?'off':''} ${state.bookSlot===s?'on':''}" onclick="pickSlot('${s}')">${s} pm</div>`).join("")}</div>
    </div>
    <div class="pad" style="padding-top:0"><button class="btn btn-coral" id="confirmBtn" onclick="confirmBooking(${id})">Confirm booking</button></div>`;
});
function stepGuests(n){state.bookGuests=Math.max(1,Math.min(12,state.bookGuests+n));$("#gv").textContent=state.bookGuests;}
function pickDate(i){state.bookDate=i;document.querySelectorAll("#dateSeg .datep").forEach((d,idx)=>d.classList.toggle("on",idx===i));}
function pickSlot(s){state.bookSlot=s;document.querySelectorAll("#slotGrid .slot").forEach(el=>el.classList.toggle("on",el.textContent.startsWith(s)));}
function confirmBooking(id){if(!state.bookSlot){toast("Pick a time first");return;}go("booked",{id});}

route("booked",({id})=>{
  const v=VENUES.find(x=>x.id===id);
  return `<div class="scroll center red-bg" style="padding:36px 30px">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="width:78px;height:78px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;box-shadow:var(--shadow-lg)">✓</div>
      <h1 class="big" style="color:#fff;margin-top:22px">Table booked!</h1>
      <p style="color:#fff;opacity:.92;margin-top:8px;font-size:15px">${v.name} · ${state.bookGuests} guests<br>${state.bookSlot} pm</p>
      ${v.offer?`<div style="background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:12px 16px;margin-top:20px;color:#fff;font-size:13px">🎁 Your offer is applied: <b>${v.offer}</b></div>`:""}
      <div style="background:rgba(255,255,255,.12);border-radius:14px;padding:14px 16px;margin-top:16px;color:#fff;font-size:12px;text-align:left;line-height:1.6;width:100%;max-width:320px">
        <b>🛡️ Meeting safely</b><br>Tell a friend your plans with <b>Share my date</b>, meet in this public venue, and trust your instincts. You've got this.</div>
    </div>
    <button class="btn btn-white" onclick="enterApp()">Done</button>
  </div>`;
});
routes.booked.red=true;

/* ---------- boot ---------- */
// register a tiny service worker for installability (inline via blob)
if("serviceWorker" in navigator){
  const sw=`self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>self.clients.claim());self.addEventListener("fetch",()=>{});`;
  const blob=new Blob([sw],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
go("welcome");
</script>
