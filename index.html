<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#D80019">
<meta name="description" content="Foodies — Love Food. Love Life. Meet people who share your taste.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Find Foodies — Love Food. Love Life</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D80019;
  --red-deep:#A80014;
  --red-dark:#7C0010;
  --coral:#F26D6D;
  --coral-soft:#F79A9A;
  --teal:#12B5A5;
  --ink:#1C2430;
  --slate:#5A6472;
  --mist:#EEF1F4;
  --line:#E4E8ED;
  --white:#ffffff;
  --gold:#D9A441;
  --shadow:0 10px 30px rgba(20,20,30,.14);
  --shadow-lg:0 24px 60px rgba(20,20,30,.28);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#2a2d33;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.script{font-family:'Pacifico',cursive;font-weight:400}

/* ---------- Phone frame ---------- */
#device{
  position:relative;
  width:min(430px,100vw);
  height:min(932px,100vh);
  background:var(--white);
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}
@media(min-width:460px) and (min-height:960px){
  #device{border-radius:44px;border:12px solid #0d0d10;height:900px}
}
#screens{position:absolute;inset:0}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateX(24px);
  transition:opacity .32s ease,transform .32s ease,visibility .32s;
  background:var(--white);
}
.screen.active{opacity:1;visibility:visible;transform:none;z-index:2}
.screen.red-bg{background:var(--red)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

/* ---------- Shared UI ---------- */
.pad{padding:22px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.brandmark{font-family:'Pacifico',cursive;color:#fff;line-height:1}
.tag{letter-spacing:3px;font-size:11px;font-weight:700;color:rgba(255,255,255,.92)}
.tag b{color:#fff}
.btn{
  border:0;border-radius:16px;font-family:inherit;font-weight:700;font-size:16px;
  padding:16px 20px;cursor:pointer;width:100%;transition:transform .12s ease,filter .2s ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(216,0,25,.32)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(242,109,109,.36)}
.btn-white{background:#fff;color:var(--red)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.btn-dark{background:var(--ink);color:#fff}
.btn-sm{padding:11px 16px;font-size:14px;border-radius:12px;width:auto}
.link{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;opacity:.9}

/* Header bar (in-app) */
.appbar{
  background:var(--red);color:#fff;padding:16px 18px 14px;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
}
.appbar .script{font-size:26px}
.appbar h2{font-size:19px;font-weight:800;letter-spacing:.3px}
.appbar .back{background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;border-radius:11px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.appbar .spacer{flex:1}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1.5px solid var(--line);background:#fff;color:var(--slate);
  border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:all .15s ease;user-select:none;
}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.diet.on{background:var(--teal);border-color:var(--teal)}
.chip-static{background:var(--mist);border:0;color:var(--slate);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700}
.chip-static.hot{background:#FFE9E9;color:var(--red)}
.chip-static.teal{background:#DFF6F3;color:#0C8073}

/* Field */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:7px;letter-spacing:.2px}
.field input,.field select{
  width:100%;border:1.5px solid var(--line);border-radius:13px;padding:14px;font:inherit;font-size:15px;color:var(--ink);background:#fff;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--coral)}

/* progress */
.prog{height:5px;background:rgba(255,255,255,.28);border-radius:3px;overflow:hidden;margin:2px 0 0}
.prog.dark{background:var(--mist)}
.prog i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .4s ease}
.prog.dark i{background:var(--coral)}

/* ---------- Onboarding slides ---------- */
.ob{position:absolute;inset:0;display:none;flex-direction:column;justify-content:space-between;padding:0;background:var(--red)}
.ob.active{display:flex;animation:fade .4s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Swipe deck ---------- */
#deck{flex:1;position:relative;padding:14px 14px 0}
.card{
  position:absolute;inset:14px 14px 0;border-radius:24px;overflow:hidden;
  background:#333;box-shadow:var(--shadow-lg);will-change:transform;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.35) 42%,rgba(0,0,0,0) 68%)}
.card .body{position:relative;padding:18px 20px 20px;color:#fff}
.card .name{font-size:25px;font-weight:800;display:flex;align-items:center;gap:8px}
.card .name .vf{font-size:15px;color:#4FC3F7}
.card .meta{font-size:13.5px;opacity:.92;margin:4px 0 10px;display:flex;gap:12px;flex-wrap:wrap}
.card .prompt{background:rgba(255,255,255,.14);backdrop-filter:blur(4px);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:11px;border:1px solid rgba(255,255,255,.15)}
.card .prompt b{display:block;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.card .cui{display:flex;flex-wrap:wrap;gap:6px}
.card .cui span{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.card .cui span.shared{background:var(--teal);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.stamp{position:absolute;top:26px;font-size:30px;font-weight:800;letter-spacing:2px;padding:6px 16px;border-radius:12px;border:4px solid;opacity:0;transform:rotate(-14deg);z-index:5}
.stamp.like{left:20px;color:var(--teal);border-color:var(--teal)}
.stamp.nope{right:20px;color:var(--coral);border-color:var(--coral)}
.match-badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;background:var(--teal);color:#fff;font-size:11px;font-weight:800;letter-spacing:.5px;padding:6px 13px;border-radius:999px;box-shadow:0 6px 14px rgba(18,181,165,.4)}
#deckEmpty{position:absolute;inset:14px 14px 0;border-radius:24px;background:var(--mist);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--slate)}

/* deck action bar */
.actions{display:flex;gap:14px;align-items:center;justify-content:center;padding:16px 0 8px}
.act{border:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:var(--shadow);transition:transform .12s}
.act:active{transform:scale(.9)}
.act.sm{width:50px;height:50px;font-size:20px}
.act.lg{width:64px;height:64px;font-size:26px}
.act.nope{color:var(--coral)} .act.like{color:var(--teal)} .act.star{color:var(--gold)} .act.rewind{color:#7C8698}

/* bottom nav */
.tabbar{
  display:flex;background:#fff;border-top:1px solid var(--line);flex-shrink:0;
  padding-bottom:var(--safe-b);
}
.tabbar button{flex:1;background:none;border:0;padding:11px 0 10px;cursor:pointer;color:#9AA3B0;font-size:22px;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:10px;font-weight:700}
.tabbar button.on{color:var(--red)}
.tabbar button .dot{position:absolute;top:6px;right:calc(50% - 18px);background:var(--coral);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* Match overlay */
#matchOverlay{position:absolute;inset:0;z-index:60;background:linear-gradient(160deg,var(--red),var(--red-dark));display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff}
#matchOverlay.show{display:flex;animation:fade .35s}
.match-photos{display:flex;justify-content:center;margin:8px 0 20px}
.match-photos .mp{width:118px;height:118px;border-radius:50%;border:4px solid #fff;object-fit:cover;box-shadow:var(--shadow-lg)}
.match-photos .mp:last-child{margin-left:-26px}
.confetti{position:absolute;width:9px;height:14px;border-radius:2px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg);opacity:.2}}

/* explore cards */
.vcard{display:flex;gap:12px;border:1px solid var(--line);border-radius:18px;padding:11px;margin-bottom:13px;cursor:pointer;background:#fff;transition:transform .12s,box-shadow .2s}
.vcard:active{transform:scale(.99)}
.vcard img{width:92px;height:92px;border-radius:13px;object-fit:cover;flex-shrink:0}
.vcard .vc{flex:1;min-width:0}
.vcard .vn{font-weight:800;font-size:15.5px}
.vcard .vsub{font-size:12.5px;color:var(--slate);margin:2px 0 7px;display:flex;gap:9px;flex-wrap:wrap}
.rowb{display:flex;gap:6px;flex-wrap:wrap}
.offer{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.2px}

/* section head */
.shead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
.shead h3{font-size:17px;font-weight:800}
.shead .more{color:var(--coral);font-size:13px;font-weight:700;cursor:pointer;background:none;border:0}

/* chat list */
.crow{display:flex;gap:13px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--mist);cursor:pointer}
.crow img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.crow .ci{flex:1;min-width:0}
.crow .cn{font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.crow .cn small{font-weight:500;color:#9AA3B0;font-size:11px}
.crow .cm{font-size:13px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.crow .badge{background:var(--coral);color:#fff;font-size:10px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* chat thread */
#thread{flex:1;overflow-y:auto;padding:16px;background:#FAFBFC;display:flex;flex-direction:column;gap:9px}
.bub{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.4}
.bub.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.bub.me{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bub.venue{align-self:flex-start;padding:0;overflow:hidden;background:#fff;border:1px solid var(--line);width:80%;border-radius:16px}
.bub.venue img{width:100%;height:96px;object-fit:cover;display:block}
.bub.venue .vb{padding:10px 12px}
.bub.venue .vb b{font-size:14px}
.bub.venue .vb p{font-size:11.5px;color:var(--slate);margin:2px 0 8px}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;padding:13px 16px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#B7BFC9;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.ice{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff;border-top:1px solid var(--mist)}
.ice::-webkit-scrollbar{height:0}
.ice button{white-space:nowrap;background:#FFE9E9;color:var(--red);border:0;border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0}
.composer{display:flex;gap:9px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);background:#fff;padding-bottom:calc(11px + var(--safe-b))}
.composer input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;font:inherit;font-size:14px}
.composer input:focus{outline:none;border-color:var(--coral)}
.composer .send{background:var(--red);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.composer .share{background:#fff;color:var(--red);border:1.5px solid var(--red);width:44px;height:44px;border-radius:50%;font-size:19px;cursor:pointer;flex-shrink:0}

/* venue detail */
#vdImg{width:100%;height:230px;object-fit:cover}
.vdhead{padding:18px 20px 0}
.vdhead h2{font-size:23px;font-weight:800}
.vdrow{display:flex;align-items:center;gap:7px;color:var(--slate);font-size:13.5px;margin-top:6px}
.info-line{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--mist);font-size:14px}
.info-line .ic{font-size:18px;width:24px;text-align:center}
.info-line b{display:block;font-size:12px;color:var(--slate);font-weight:700;margin-bottom:2px}

/* booking */
.seg{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}
.seg::-webkit-scrollbar{height:0}
.datep{flex-shrink:0;border:1.5px solid var(--line);border-radius:14px;padding:11px 15px;text-align:center;cursor:pointer;min-width:60px}
.datep.on{background:var(--teal);border-color:var(--teal);color:#fff}
.datep b{display:block;font-size:11px;opacity:.8}.datep span{font-size:19px;font-weight:800}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.slot{border:1.5px solid var(--line);border-radius:12px;padding:12px 0;text-align:center;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--slate)}
.slot.on{background:var(--red);border-color:var(--red);color:#fff}
.slot.off{opacity:.4;pointer-events:none}
.stepper{display:flex;align-items:center;gap:18px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--coral);background:#fff;color:var(--coral);font-size:20px;font-weight:700;cursor:pointer}
.stepper span{font-size:20px;font-weight:800;min-width:24px;text-align:center}

/* profile */
.pfhero{position:relative}
.pfhero img{width:100%;height:250px;object-fit:cover}
.pfhero .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 55%)}
.pfhero .nm{position:absolute;bottom:16px;left:20px;color:#fff}
.pfhero .nm h2{font-size:24px;font-weight:800}
.tier{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#F6D488,#D9A441);color:#5C4008;font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px;margin-top:6px}
.menu-row{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--mist);font-size:15px;font-weight:600;cursor:pointer}
.menu-row .ic{font-size:20px;width:26px;text-align:center}
.menu-row .ar{margin-left:auto;color:#C4CBD4}

/* plans */
.plan{border:2px solid var(--line);border-radius:20px;padding:20px;margin-bottom:15px;position:relative}
.plan.gold{border-color:var(--gold);background:linear-gradient(180deg,#FFFBF2,#fff)}
.plan .pt{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--slate)}
.plan.gold .pt{color:#B8860B}
.plan .pp{font-size:32px;font-weight:800;margin:6px 0 3px}
.plan .pp small{font-size:14px;font-weight:600;color:var(--slate)}
.plan ul{list-style:none;margin:14px 0 0}
.plan li{font-size:13.5px;padding:6px 0 6px 26px;position:relative;color:var(--ink)}
.plan li:before{content:"✓";position:absolute;left:0;color:var(--teal);font-weight:800}
.plan .rec{position:absolute;top:-11px;right:18px;background:var(--gold);color:#fff;font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:999px;letter-spacing:.5px}

.toast{position:absolute;bottom:calc(80px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;transition:all .3s;z-index:70;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.muted{color:var(--slate)}
.h-sub{font-size:13px;color:var(--slate);line-height:1.5}
h1.big{font-size:29px;font-weight:800;line-height:1.15}
.divide{height:1px;background:var(--mist);margin:16px 0}
.safety{background:#FFF6F6;border:1px solid #F8D7D7;border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--red-dark);line-height:1.55}
.pill-toggle{display:flex;background:var(--mist);border-radius:12px;padding:4px;margin-bottom:14px}
.pill-toggle button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:inherit;font-weight:700;font-size:13.5px;color:var(--slate);cursor:pointer}
.pill-toggle button.on{background:#fff;color:var(--red);box-shadow:0 2px 6px rgba(0,0,0,.08)}

/* explore search */
.searchwrap{padding:12px 16px 14px;border-bottom:1px solid var(--mist);flex-shrink:0;background:#fff}
.searchbar{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:4px 4px 4px 12px;background:#fff}
.searchbar input{flex:1;border:0;font:inherit;font-size:14px;padding:9px 0;outline:none}
.sbtn{background:var(--red);color:#fff;border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}
.radius-row{display:flex;align-items:center;gap:12px;margin:12px 0 10px}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--mist)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--red);cursor:pointer;box-shadow:0 2px 6px rgba(216,0,25,.4)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--red);cursor:pointer}

/* map */
.mapbox{position:relative;width:100%;height:420px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#E8EDF2,#DDE6EC);border:1px solid var(--line)}
.mapgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(150,165,180,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(150,165,180,.25) 1px,transparent 1px);background-size:38px 38px}
.mapbox:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(18,181,165,.08),transparent 60%)}
.pin{position:absolute;transform:translate(-50%,-100%);background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;z-index:2}
.pin .pindot{width:32px;height:32px;border-radius:50% 50% 50% 2px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 10px rgba(0,0,0,.28);transform:rotate(0)}
.pin .pinlbl{font-size:10px;font-weight:700;background:#fff;padding:2px 6px;border-radius:6px;margin-top:3px;box-shadow:0 2px 5px rgba(0,0,0,.12);white-space:nowrap}
.pin.me{z-index:1}.pin.me .pindot{background:var(--ink)}

/* group meet-ups */
.gcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
.gcard .gtop{height:96px;position:relative;display:flex;align-items:flex-end;padding:12px}
.gcard .gtop .gv{color:#fff;font-weight:800;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.gcard .gbody{padding:13px 15px}

/* video call */

.callmain img{width:100%;height:100%;object-fit:cover;filter:brightness(.85)}
.callself{position:absolute;bottom:18px;right:16px;width:96px;height:132px;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.5);box-shadow:var(--shadow-lg)}
.callself img{width:100%;height:100%;object-fit:cover}

.callbar{display:flex;justify-content:center;gap:18px;padding:22px 0 calc(28px + var(--safe-b))}
.callbtn{width:58px;height:58px;border-radius:50%;border:0;font-size:23px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);color:#fff}

/* safety toolkit */
.safety-tile{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px}
.safety-tile .st-ic{width:42px;height:42px;border-radius:12px;background:#FFF0F0;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.safety-tile b{font-size:14.5px}.safety-tile p{font-size:12.5px;color:var(--slate);margin-top:2px;line-height:1.45}
.safety-tile .sw{margin-left:auto;align-self:center}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.switch.on{background:var(--teal)}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on i{left:21px}

<body>
<div id="device">
  <div id="screens"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="venues.js"></script>
<script>

// ---- Sample data ---------------------------------------------------
const CUISINES = ["Italian","Indian","Japanese","Lebanese","Chinese","Thai","Mexican","French","Korean","Turkish","Greek","Spanish","Vietnamese","Ethiopian"];
const DIETS = ["Halal","Kosher","Vegan","Vegetarian","Gluten-free","Pescatarian"];

const me = { name:"You", cuisines:["Italian","Japanese","Lebanese"], diets:["Halal"] };

const FOODIES = [
  {id:1,name:"Amara",age:27,dist:"1.2 mi",looking:"Relationship",verified:true,
   img:"img/p4.jpg",
   cuisines:["Italian","Lebanese","Thai"],
   prompt:{q:"My go-to comfort dish",a:"A proper bowl of cacio e pepe on a rainy night."}},
  {id:2,name:"Priya",age:29,dist:"0.8 mi",looking:"Something casual",verified:true,
   img:"img/p1.jpg",
   cuisines:["Indian","Japanese","Korean"],
   prompt:{q:"Order for the table or your own?",a:"Order for the table — always. Sharing is the whole point."}},
  {id:3,name:"Sofia",age:25,dist:"2.4 mi",looking:"Relationship",verified:false,
   img:"img/p16.jpg",
   cuisines:["Japanese","Italian","French"],
   prompt:{q:"Best meal you've had this year",a:"Omakase in Soho. I still think about the uni."}},
  {id:4,name:"Leila",age:31,dist:"3.1 mi",looking:"New friends",verified:true,
   img:"img/p13.jpg",
   cuisines:["Lebanese","Turkish","Greek"],
   prompt:{q:"Sweet or savoury?",a:"Both, at once, no notes. Baklava counts as breakfast."}},
  {id:5,name:"Chloé",age:26,dist:"1.9 mi",looking:"Relationship",verified:true,
   img:"img/p8.jpg",
   cuisines:["French","Italian","Spanish"],
   prompt:{q:"Dream dinner guest",a:"Someone who'll split a bottle and stay for dessert."}}
];

// Full London dataset from venues.js — normalise fields the app expects
const MY_LOC = {lat:51.5074,lng:-0.1278,label:"Central London"}; // default "me" location
function haversineMi(a,b){const R=3959;const dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return R*2*Math.asin(Math.sqrt(x));}
const VENUES = (window.LONDON_VENUES||[]).map(v=>({
  ...v,
  area:v.area+", London",
  addr:v.area+" · "+v.postcode,
  dist:haversineMi(MY_LOC,{lat:v.lat,lng:v.lng}).toFixed(1)+" mi",
  distMi:haversineMi(MY_LOC,{lat:v.lat,lng:v.lng})
}));

// shared-cuisine helper
const shared = (a,b)=>a.filter(c=>b.includes(c));

// ---- App state -----------------------------------------------------
const state = {
  step:0,             // onboarding step
  selCuisines:[...me.cuisines],
  selDiets:[...me.diets],
  deckIdx:0,
  lastSwiped:null,
  matches:[],         // foodie objects matched
  activeChat:null,
  threads:{},         // id -> [{who,text,venue}]
  bookingVenue:null,
  bookDate:0,bookSlot:null,bookGuests:2,
  tab:"discover",
  tier:"free",
  radius:5, exFilter:"all", exDiets:[], exView:"list", searchCentre:null, searchLabel:null,
  groups:[]
};

// seed one existing match + chat so the app isn't empty
state.matches.push(FOODIES[1]);
state.threads[FOODIES[1].id]=[
  {who:"them",text:"Hey! Saw we both can't say no to Japanese 🍣"},
  {who:"me",text:"Guilty. Omakase or ramen person?"},
  {who:"them",text:"Both, obviously. Where are you thinking?"}
];

const $=(s,r=document)=>r.querySelector(s);
const screensEl=$("#screens");

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1900);}

// ---- Screen router -------------------------------------------------
const routes={};
function route(name,builder){routes[name]=builder;}
let current=null;
function go(name,opts){
  const html=routes[name](opts||{});
  let el=document.createElement("div");
  el.className="screen"+(routes[name].red?" red-bg":"");
  el.innerHTML=html;
  el.id="scr-"+name;
  // remove old same-id
  const old=$("#scr-"+name);if(old)old.remove();
  screensEl.appendChild(el);
  requestAnimationFrame(()=>{
    document.querySelectorAll(".screen.active").forEach(s=>{if(s!==el)s.classList.remove("active")});
    el.classList.add("active");
  });
  if(routes[name].after)routes[name].after(el,opts||{});
  current=name;
  setTimeout(()=>{document.querySelectorAll(".screen").forEach(s=>{if(!s.classList.contains("active")&&s!==el)s.remove();});},400);
}

/* =========================================================
   ONBOARDING
   ========================================================= */
route("welcome",()=>`
  <div class="center" style="flex:1;padding:40px 30px">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="brandmark" style="font-size:64px">Foodies</div>
      <div class="tag" style="margin-top:10px">LOVE <b>FOOD</b> . LOVE <b>LIFE</b></div>

    </div>

    </div>
  </div>`);
routes.welcome.red=true;

route("signup",()=>`
  <div class="scroll center red-bg" style="padding:44px 30px">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%">
      <div class="brandmark" style="font-size:44px">Foodies</div>
      <div class="tag" style="margin:8px 0 40px">LOVE <b>FOOD</b> . LOVE <b>LIFE</b></div>
      <p style="color:#fff;font-size:12px;letter-spacing:2px;font-weight:700;margin-bottom:18px">SIGN UP WITH</p>
      <button class="btn btn-white" style="margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px" onclick="googleSignup()">

      <button class="btn btn-white" style="margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px" onclick="startOnboard()">

        ✉️ Use your email</button>

routes.signup.red=true;

/* ---- Demo Google sign-up (looks like real OAuth; real flow needs a backend) ---- */
function googleSignup(){go("google");}
function appleSignup(){toast("Apple sign-in — demo");startOnboard();}
route("google",()=>`
  <div class="scroll" style="background:#fff;padding:0">
    <div style="max-width:400px;margin:0 auto;padding:28px 24px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px">
        <svg width="24" height="24" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span style="font-size:15px;color:#5f6368">Sign in with Google</span>
      </div>
      <h2 style="font-size:24px;font-weight:400;color:#202124;margin-bottom:6px">Choose an account</h2>
      <p style="font-size:14px;color:#5f6368;margin-bottom:24px">to continue to <b style="font-weight:500">Find Foodies</b></p>
      <div style="border:1px solid #dadce0;border-radius:8px;overflow:hidden">
        ${[{n:"Alex Morgan",e:"alex.morgan@gmail.com",c:"#DB4437"},{n:"Sam Taylor",e:"sam.taylor@gmail.com",c:"#4285F4"}].map(a=>`

            <div style="width:34px;height:34px;border-radius:50%;background:${a.c};color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500">${a.n[0]}</div>
            <div><div style="font-size:14px;color:#202124;font-weight:500">${a.n}</div><div style="font-size:13px;color:#5f6368">${a.e}</div></div>
          </div>`).join("")}
        <div onclick="startOnboard()" style="display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer" onmouseover="this.style.background='#f8f9fa'" onmouseout="this.style.background='#fff'">
          <div style="width:34px;height:34px;border-radius:50%;border:1px solid #dadce0;display:flex;align-items:center;justify-content:center;color:#5f6368">+</div>

      <div style="display:flex;justify-content:space-between;margin-top:26px">

      </div>
      <p style="font-size:11px;color:#9aa0a6;margin-top:30px;text-align:center;border-top:1px solid #f1f3f4;padding-top:14px">Demo sign-in — a real Google login connects to your backend.</p>
    </div>
  </div>`);
function googlePicked(name){me.name=name.split(" ")[0];toast("Signed in as "+name);startOnboard();}

// onboarding flow container
const OB_STEPS=["details","cuisine","diet","photos","done"];
function startOnboard(){state.step=0;go("onboard");}
function obNext(){state.step++;if(state.step>=OB_STEPS.length){enterApp();return;}go("onboard");}
function obBack(){if(state.step===0){go("signup");return;}state.step--;go("onboard");}

route("onboard",()=>{
  const step=OB_STEPS[state.step];
  const pct=((state.step)/(OB_STEPS.length-1))*100;
  let inner="";
  if(step==="details"){
    inner=`
      <h1 class="big" style="margin-bottom:6px">Tell us a little<br>about you</h1>
      <p class="h-sub" style="margin-bottom:22px">This helps us find your most compatible, local matches.</p>
      <div class="field"><label>First name</label><input placeholder="e.g. Alex" value=""></div>
      <div class="field"><label>Location</label><input placeholder="Select within UK" value="London"></div>
      <div class="field"><label>I am a</label>
        <select><option>Woman</option><option>Man</option><option>Non-binary</option></select></div>
      <div class="field"><label>Looking for</label>
        <select><option>Relationship</option><option>Something casual</option><option>New friends</option><option>Dinner company</option></select></div>`;
  }else if(step==="cuisine"){
    inner=`
      <h1 class="big" style="margin-bottom:6px">What do you<br>love to eat?</h1>
      <p class="h-sub" style="margin-bottom:20px">Pick your favourites — we match people who share your taste.</p>
      <div class="chips" id="cuiChips">
        ${CUISINES.map(c=>`<button class="chip ${state.selCuisines.includes(c)?'on':''}" onclick="toggleCui(this,'${c}')">${c}</button>`).join("")}
      </div>`;
  }else if(step==="diet"){
    inner=`
      <h1 class="big" style="margin-bottom:6px">Any dietary or<br>faith preferences?</h1>
      <p class="h-sub" style="margin-bottom:20px">We'll only suggest venues that cater to you. Optional.</p>
      <div class="chips">
        ${DIETS.map(d=>`<button class="chip diet ${state.selDiets.includes(d)?'on':''}" onclick="toggleDiet(this,'${d}')">${d}</button>`).join("")}
      </div>`;
  }else if(step==="photos"){
    inner=`
      <h1 class="big" style="margin-bottom:6px">Add a few<br>photos</h1>
      <p class="h-sub" style="margin-bottom:20px">And a verified selfie — every Foodie is checked, so matches are real and safe. <span style="color:var(--teal);font-weight:700">✓ Verification keeps the community genuine.</span></p>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        ${[0,1,2,3,4,5].map(i=>`<div style="aspect-ratio:3/4;border-radius:14px;background:${i===0?'#ddd':'var(--mist)'};display:flex;align-items:center;justify-content:center;color:#B7BFC9;font-size:26px;border:2px dashed ${i===0?'transparent':'#D6DCE3'};overflow:hidden">${i===0?'<img src="img/p6.jpg" style="width:100%;height:100%;object-fit:cover">':'＋'}</div>`).join("")}
      </div>
      <div style="display:flex;align-items:center;gap:9px;margin-top:18px;color:var(--teal);font-weight:700;font-size:13.5px">
        <span style="background:var(--teal);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px">✓</span> Photo verified</div>`;
  }else if(step==="done"){
    inner=`<div class="center" style="flex:1;color:#fff">
        <div class="brandmark" style="font-size:44px">Foodies</div>
        <div class="tag" style="margin:8px 0 40px">LOVE <b>FOOD</b> . LOVE <b>LIFE</b></div>
        <div class="script" style="font-size:40px;color:#fff">Good going!</div>
        <p style="letter-spacing:3px;font-weight:700;margin-top:24px;font-size:14px">YOUR PROFILE IS<br>NOW COMPLETE</p>
      </div>`;
  }

  if(step==="done"){
    return `<div class="scroll red-bg center" style="padding:30px">
      ${inner}
      <button class="btn btn-white" style="margin-top:40px" onclick="obNext()">Find your Foodie →</button>
    </div>`;
  }
  return `
    <div class="appbar"><button class="back" onclick="obBack()">‹</button>
      <div class="script">Foodies</div><div class="spacer"></div>
      <span style="font-size:12px;font-weight:700;opacity:.85">${state.step+1}/4</span></div>
    <div style="padding:0 22px"><div class="prog dark" style="margin:16px 0 4px"><i style="width:${pct}%"></i></div></div>
    <div class="scroll pad">${inner}</div>
    <div class="pad" style="padding-top:0"><button class="btn btn-coral" onclick="obNext()">Continue</button></div>`;
});

function toggleCui(el,c){el.classList.toggle("on");const i=state.selCuisines.indexOf(c);if(i<0)state.selCuisines.push(c);else state.selCuisines.splice(i,1);me.cuisines=state.selCuisines;}
function toggleDiet(el,d){el.classList.toggle("on");const i=state.selDiets.indexOf(d);if(i<0)state.selDiets.push(d);else state.selDiets.splice(i,1);me.diets=state.selDiets;}

/* =========================================================
   MAIN APP SHELL + TABS
   ========================================================= */
function enterApp(){state.tab="discover";go("app");setTimeout(askNotifications,900);}

route("app",()=>{
  return `
    <div id="tabContent" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
    <div class="tabbar" id="tabbar">
      <button data-tab="discover" onclick="switchTab('discover')">🔥<span>Discover</span></button>
      <button data-tab="explore" onclick="switchTab('explore')">🍽️<span>Venues</span></button>
      <button data-tab="groups" onclick="switchTab('groups')">👥<span>Meet-ups</span></button>
      <button data-tab="chats" onclick="switchTab('chats')">💬<span>Chats</span></button>
      <button data-tab="profile" onclick="switchTab('profile')">👤<span>Profile</span></button>
    </div>`;
});
routes.app.after=()=>{switchTab(state.tab);};

function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const unread=Object.values(state.threads).filter(t=>t.some(m=>m.unread)).length;
  const c=$("#tabContent");if(!c)return;
  if(tab==="discover")c.innerHTML=tabDiscover();
  if(tab==="explore"){c.innerHTML=tabExplore();renderExploreBody();}
  if(tab==="groups")c.innerHTML=tabGroups();
  if(tab==="chats")c.innerHTML=tabChats();
  if(tab==="profile")c.innerHTML=tabProfile();
  if(tab==="discover")initDeck();
  // chat badge
  const chatBtn=document.querySelector('#tabbar [data-tab="chats"]');
  const oldDot=chatBtn.querySelector(".dot");if(oldDot)oldDot.remove();
  const n=state.matches.filter(m=>!state.threads[m.id]||state.threads[m.id].length<=3).length;
}

/* ---------- DISCOVER (swipe deck) ---------- */
function tabDiscover(){
  return `
    <div class="appbar"><div class="script" style="font-size:24px">Find your Foodie</div><div class="spacer"></div>
      <button class="back" onclick="toast('Filters — demo')">⚙</button></div>
    <div style="padding:10px 16px 0"><div style="background:#FFF3F3;border:1px solid #F8D7D7;border-radius:12px;padding:9px 13px;font-size:12px;color:var(--red-dark);display:flex;align-items:center;gap:8px">
      <span style="font-size:15px">💡</span> Green tags are cuisines you <b>both</b> love — that's your match.</div></div>
    <div id="deck"></div>
    <div id="deckEmpty"><div style="font-size:40px;margin-bottom:12px">🍽️</div><b style="color:var(--ink);font-size:17px">That's everyone nearby</b><p style="margin-top:6px">Check back soon — new Foodies join every day.</p><button class="btn btn-coral btn-sm" style="margin-top:16px" onclick="resetDeck()">Start over</button></div>
    <div class="actions">
      <button class="act sm rewind" onclick="rewind()" title="Undo">↩</button>
      <button class="act lg nope" onclick="swipe('left')">✕</button>
      <button class="act sm star" onclick="swipe('super')">★</button>
      <button class="act lg like" onclick="swipe('right')">♥</button>
    </div>`;
}
function initDeck(){
  const deck=$("#deck");if(!deck)return;
  deck.innerHTML="";
  const remaining=FOODIES.slice(state.deckIdx);
  if(remaining.length===0){$("#deck").style.display="none";$("#deckEmpty").style.display="flex";return;}
  $("#deck").style.display="block";$("#deckEmpty").style.display="none";
  // render up to 3 stacked
  remaining.slice(0,3).reverse().forEach((f)=>{
    const sh=shared(me.cuisines,f.cuisines);
    const isMatch=sh.length>=2;
    const card=document.createElement("div");
    card.className="card";card.dataset.id=f.id;
    card.innerHTML=`
      <img src="${f.img}" alt="${f.name}">
      <div class="veil"></div>
      ${isMatch?`<div class="match-badge">★ ${sh.length} shared cuisines</div>`:""}
      <div class="stamp like">MATCH</div><div class="stamp nope">PASS</div>
      <div class="body">
        <div class="name">${f.name}, ${f.age} ${f.verified?'<span class="vf">✓</span>':''}</div>
        <div class="meta"><span>📍 ${f.dist}</span><span>💘 ${f.looking}</span></div>
        <div class="prompt"><b>${f.prompt.q}</b>${f.prompt.a}</div>
        <div class="cui">${f.cuisines.map(c=>`<span class="${sh.includes(c)?'shared':''}">${c}</span>`).join("")}</div>
      </div>`;
    deck.appendChild(card);
    if(f.id===remaining[0].id)attachDrag(card);
  });
}
function topCard(){const deck=$("#deck");return deck?deck.lastElementChild:null;}
function attachDrag(card){
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const like=card.querySelector(".stamp.like"),nope=card.querySelector(".stamp.nope");
  const down=e=>{drag=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;card.style.transition="none";};
  const move=e=>{if(!drag)return;const p=e.touches?e.touches[0]:e;dx=p.clientX-sx;dy=p.clientY-sy;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    like.style.opacity=Math.max(0,dx/90);nope.style.opacity=Math.max(0,-dx/90);};
  const up=()=>{if(!drag)return;drag=false;card.style.transition="transform .3s ease";
    if(dx>95){finishSwipe(card,"right");}
    else if(dx<-95){finishSwipe(card,"left");}
    else{card.style.transform="";like.style.opacity=0;nope.style.opacity=0;}dx=0;dy=0;};
  card.addEventListener("touchstart",down,{passive:true});card.addEventListener("touchmove",move,{passive:true});card.addEventListener("touchend",up);
  card.addEventListener("mousedown",down);window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
}
function swipe(dir){const card=topCard();if(!card)return;finishSwipe(card,dir);}
function finishSwipe(card,dir){
  const id=+card.dataset.id;const f=FOODIES.find(x=>x.id===id);
  state.lastSwiped=state.deckIdx;
  const off=dir==="left"?-600:600;
  card.style.transition="transform .35s ease";
  card.style.transform=`translate(${dir==="left"?-off:off}px,-40px) rotate(${dir==="left"?-24:24}deg)`;
  setTimeout(()=>{
    state.deckIdx++;
    if((dir==="right"||dir==="super")){
      const sh=shared(me.cuisines,f.cuisines);
      if(sh.length>=2){ // it's a match
        if(!state.matches.find(m=>m.id===f.id))state.matches.unshift(f);
        showMatch(f);
        notify("It's a Match! 🎉",`You and ${f.name} both love ${shared(me.cuisines,f.cuisines).join(" & ")}. Say hello!`);
      }else toast(dir==="super"?"Super like sent ★":"Liked ♥");
    }
    initDeck();
  },320);
}
function rewind(){if(state.deckIdx>0){state.deckIdx--;initDeck();toast("Rewound ↩");}else toast("Nothing to undo");}

/* ---------- venue matching logic (signature) ---------- */
function bestVenuesFor(f){
  const wantCui=[...new Set([...shared(me.cuisines,f.cuisines),...me.cuisines])];
  const wantDiet=me.diets;
  return [...VENUES].map(v=>{
    let score=0;
    v.cuisines.forEach(c=>{if(wantCui.includes(c))score+=wantCui.includes(c)&&shared(me.cuisines,f.cuisines).includes(c)?3:1;});
    if(wantDiet.every(d=>v.diets.includes(d)))score+=2;
    if(v.offer)score+=1;
    return {...v,score};
  }).sort((a,b)=>b.score-a.score);
}

function filteredVenues(){
  const c=state.searchCentre||MY_LOC;
  let list=VENUES.map(v=>({...v,d:haversineMi(c,{lat:v.lat,lng:v.lng})}));
  list=list.filter(v=>v.d<=state.radius);

  list.sort((a,b)=>{
    if(state.exFilter==='forme')return shared(me.cuisines,b.cuisines).length-shared(me.cuisines,a.cuisines).length||a.d-b.d;
    return a.d-b.d;
  });
  return list;
}
function renderExploreBody(){
  const body=$("#exploreBody");if(!body)return;
  const list=filteredVenues();

function venueCard(v){
  const sh=shared([...me.cuisines],v.cuisines);

  return `<div class="vcard" onclick="openVenue(${v.id})">

    </div></div>`;

// simple schematic map (no external tiles — self-contained)
function renderMap(list){
  const c=state.searchCentre||MY_LOC;
  // project lat/lng to a local box
  const pad=0.02;
  const lats=list.map(v=>v.lat).concat(c.lat),lngs=list.map(v=>v.lng).concat(c.lng);
  const minLat=Math.min(...lats)-pad,maxLat=Math.max(...lats)+pad,minLng=Math.min(...lngs)-pad,maxLng=Math.max(...lngs)+pad;
  const X=lng=>((lng-minLng)/(maxLng-minLng))*100;
  const Y=lat=>(1-(lat-minLat)/(maxLat-minLat))*100;
  const pins=list.map(v=>`<button class="pin" style="left:${X(v.lng)}%;top:${Y(v.lat)}%" onclick="openVenue(${v.id})" title="${v.name}">
     <span class="pindot">${v.offer?'🎁':'🍽️'}</span><span class="pinlbl">${v.name.split(' ')[0]}</span></button>`).join("");
  return `
    <div class="mapbox">
      <div class="mapgrid"></div>
      <div class="pin me" style="left:${X(c.lng)}%;top:${Y(c.lat)}%"><span class="pindot" style="background:var(--ink)">📍</span></div>
      ${pins}
    </div>
    <p class="h-sub" style="margin-top:12px;text-align:center">${list.length} venues shown · tap a pin to view. <br><span style="opacity:.7">Schematic map — live maps come with the full build.</span></p>`;
}

function runSearch(){

  let key=Object.keys(cent).find(k=>raw.replace(/\s/g,'').startsWith(k)&&k!=="LONDON");
  if(key){state.searchCentre={lat:cent[key][0],lng:cent[key][1]};state.searchLabel=key;}
  else{
    const v=VENUES.find(x=>x.area.toUpperCase().includes(raw)||x.postcode.toUpperCase().startsWith(raw));
    if(v){state.searchCentre={lat:v.lat,lng:v.lng};state.searchLabel=v.area.replace(', London','');}

  renderExploreBody();
  toast("Showing venues near "+state.searchLabel);

route("book",({id})=>{

    <div class="scroll pad">

function confirmBooking(id){if(!state.bookSlot){toast("Pick a time first");return;}const v=VENUES.find(x=>x.id===id);notify("Table booked ✅",`${v.name} · ${state.bookGuests} guests at ${state.bookSlot} pm`);go("booked",{id});}

/* ---------- PWA: service worker, install, notifications ---------- */
let swReg=null, deferredInstall=null;
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(r=>{swReg=r;}).catch(()=>{});
}
// capture the install prompt (Android/Chrome)
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;showInstallBar();});
window.addEventListener("appinstalled",()=>{deferredInstall=null;hideInstallBar();toast("Foodies installed 🎉");});

function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}

function showInstallBar(){
  if(isStandalone()||document.getElementById("installBar"))return;
  const b=document.createElement("div");b.id="installBar";
  b.innerHTML=`<div style="display:flex;align-items:center;gap:12px">
     <img src="icon-192.png" style="width:40px;height:40px;border-radius:11px">
     <div style="flex:1;line-height:1.25"><b style="font-size:13.5px">Install Foodies</b><div style="font-size:11.5px;opacity:.75">Add to your home screen</div></div>
     <button onclick="doInstall()" style="background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer">Install</button>
     <button onclick="hideInstallBar()" style="background:none;border:0;font-size:20px;color:#9AA3B0;cursor:pointer">×</button>
   </div>`;
  Object.assign(b.style,{position:"absolute",left:"12px",right:"12px",bottom:"calc(12px + var(--safe-b))",background:"#fff",borderRadius:"16px",padding:"12px 14px",boxShadow:"var(--shadow-lg)",zIndex:80});
  document.getElementById("device").appendChild(b);
}
function hideInstallBar(){const b=document.getElementById("installBar");if(b)b.remove();}
function doInstall(){
  if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;hideInstallBar();});}
  else if(isIOS()){showIOSInstall();}
  else{toast("Use your browser menu → Add to Home Screen");hideInstallBar();}
}
function showIOSInstall(){
  const m=document.createElement("div");m.id="iosSheet";
  m.innerHTML=`<div style="background:#fff;border-radius:20px 20px 0 0;padding:22px;text-align:center">
    <img src="icon-192.png" style="width:56px;height:56px;border-radius:15px;margin-bottom:10px">
    <h3 style="font-size:17px;margin-bottom:6px">Install Foodies</h3>
    <p style="font-size:13.5px;color:var(--slate);line-height:1.5">Tap the <b>Share</b> icon <span style="font-size:16px">􀈂</span> in Safari, then choose <b>“Add to Home Screen”</b>.</p>
    <button onclick="document.getElementById('iosSheet').remove()" class="btn btn-coral" style="margin-top:16px">Got it</button></div>`;
  Object.assign(m.style,{position:"absolute",inset:0,background:"rgba(0,0,0,.45)",zIndex:90,display:"flex",alignItems:"flex-end"});
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.getElementById("device").appendChild(m);
}

// Notification permission — asked at a natural moment (after first match / entering app)
function askNotifications(){
  if(!("Notification" in window))return;
  if(Notification.permission!=="default")return;      // already asked
  if(sessionStorage.getItem("notifAsked"))return;
  sessionStorage.setItem("notifAsked","1");
  const m=document.createElement("div");m.id="notifSheet";
  m.innerHTML=`<div style="background:#fff;border-radius:22px;padding:26px 22px;text-align:center;max-width:330px;margin:auto">
    <div style="width:64px;height:64px;border-radius:50%;background:#FFE9E9;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px">🔔</div>
    <h3 style="font-size:19px;margin-bottom:8px">Never miss a match</h3>
    <p style="font-size:13.5px;color:var(--slate);line-height:1.55">Turn on notifications and we'll let you know about new matches, messages and table bookings.</p>
    <button onclick="enableNotifications()" class="btn btn-primary" style="margin-top:18px">Turn on notifications</button>
    <button onclick="document.getElementById('notifSheet').remove()" class="link" style="margin-top:14px;width:100%;color:var(--slate)">Not now</button>
  </div>`;
  Object.assign(m.style,{position:"absolute",inset:0,background:"rgba(0,0,0,.5)",zIndex:90,display:"flex",padding:"24px"});
  document.getElementById("device").appendChild(m);
}
function enableNotifications(){
  const sheet=document.getElementById("notifSheet");if(sheet)sheet.remove();
  Notification.requestPermission().then(p=>{
    if(p==="granted"){
      toast("Notifications on 🔔");
      notify("Welcome to Foodies!","We'll ping you the moment someone likes you.");
    }else{toast("You can turn these on later in Settings");}
  });
}
function notify(title,body){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  if(swReg&&swReg.active){swReg.active.postMessage({type:"notify",title,body});}
  else{try{new Notification(title,{body,icon:"icon-192.png"});}catch(e){}}
}

/* ---------- VIDEO DATE (pre-meet call) ---------- */
let callTimer=null;
function startCall(id){
  const f=FOODIES.find(x=>x.id===id)||state.matches.find(x=>x.id===id);if(!f)return;
  let cs=document.getElementById("callScreen");if(cs)cs.remove();
  cs=document.createElement("div");cs.id="callScreen";cs.className="show";
  cs.innerHTML=`
    <div class="callmain">
      <img src="${f.img}" alt="${f.name}">
      <div class="callinfo"><h3>${f.name}</h3><p id="callState">Connecting…</p></div>
      <div class="callbadge">🔒 Foodies keeps your number private</div>
      <div class="callself"><img src="img/p6.jpg"></div>
    </div>
    <div class="callbar">
      <button class="callbtn" onclick="toast('Mic off')">🎤</button>
      <button class="callbtn end" onclick="endCall()">📞</button>
      <button class="callbtn" onclick="toast('Camera flipped')">🔄</button>
    </div>`;
  document.getElementById("device").appendChild(cs);
  let s=0;const states=["Connecting…","Ringing…","Connected — say hi! 👋"];
  callTimer=setInterval(()=>{s++;const el=document.getElementById("callState");if(el&&s<states.length)el.textContent=states[s];if(s>=states.length){clearInterval(callTimer);let sec=0;callTimer=setInterval(()=>{sec++;const e2=document.getElementById("callState");if(e2)e2.textContent="00:"+String(sec).padStart(2,"0");},1000);}},1100);
}
function endCall(){clearInterval(callTimer);const cs=document.getElementById("callScreen");if(cs){cs.classList.remove("show");setTimeout(()=>cs.remove(),200);}toast("Call ended — nice chat!");}
